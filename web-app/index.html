<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#563AE4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LingoClub" />
  <meta name="description" content="Bilingual English–Arabic social learning studio with Live Kahoot Quiz Clash, 200-Word Weekly Club, Crime Mystery Arcade, 3D Flashcards, Roleplays, Audiobooks, and 18,600+ word dictionary." />

  <title>LingoClub — Bilingual English–Arabic Learning Studio</title>

  <link rel="icon" type="image/jpeg" href="./assets/app_icon_lingoclub.jpg" />
  <link rel="apple-touch-icon" href="./assets/app_icon_lingoclub.jpg" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono, Noto Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">
    <!-- Desktop / Tablet Side Navigation Rail (visible >= 600px when signed in) -->
    <aside id="nav-rail" class="nav-rail hidden" aria-label="Main navigation"></aside>

    <!-- Main Scrollable Viewport -->
    <div class="main-column">
      <main id="app-root" class="app-root" tabindex="-1"></main>
    </div>

    <!-- Mobile Bottom Navigation Bar (visible < 600px when signed in) -->
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Bottom navigation"></nav>
  </div>

  <!-- Global Overlays -->
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
  <div id="popover-root" class="popover-root hidden" role="dialog" aria-modal="true" aria-label="Word translation"></div>
  <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
